name: Shared checks
on:
  workflow_call:
permissions:
  contents: read
env:
  EXPO_NO_TELEMETRY: '1'
  EXPO_UNSTABLE_HEADLESS: '1'
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: --max-old-space-size=640
jobs:
  policy:
    name: Workflow and security checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate workflows and deployment shell scripts
        run: ./scripts/check-workflows
      - name: Check local documentation and screenshot links
        run: node scripts/check-docs.mjs
      - name: Scan the complete Git history for secrets
        run: ./scripts/check-secrets
  quality:
    name: Types and API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all workspace types
        run: pnpm typecheck
      - name: Audit deployed dependencies
        run: pnpm security:check
      - name: Test business rules and real PostgreSQL API
        run: pnpm test
  web:
    name: Web build and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check proxy failure log privacy
        run: ./scripts/check-edge-privacy
      - name: Check private development gateway protection
        run: ./scripts/check-development-edge
      - name: Build API and production web app
        run: pnpm build
      - name: Install Chromium with runner dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test desktop and mobile browser flows
        run: pnpm test:e2e
  native:
    name: Native Android and iOS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Export native Android and iOS JavaScript
        run: pnpm mobile:export
  selfhost:
    name: Docker self-hosting
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build and exercise a fresh checkout without host app dependencies
        run: node scripts/check-self-hosting.mjs
      - name: Show isolated check diagnostics on failure
        if: failure()
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, existsSync } from 'node:fs';
          const file = '.local/self-hosting-result.json';
          if (existsSync(file)) {
            const report = JSON.parse(readFileSync(file, 'utf8'));
            console.log(JSON.stringify(report, null, 2));
            if (existsSync(report.log))
              console.log(readFileSync(report.log, 'utf8').split('\n').slice(-100).join('\n'));
          }
          JS
  gate:
    name: Required checks
    if: always()
    needs: [policy, quality, web, native, selfhost]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require every check to succeed
        env:
          POLICY_RESULT: ${{ needs.policy.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          WEB_RESULT: ${{ needs.web.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SELFHOST_RESULT: ${{ needs.selfhost.result }}
        run: |
          for result in "$POLICY_RESULT" "$QUALITY_RESULT" "$WEB_RESULT" "$NATIVE_RESULT" "$SELFHOST_RESULT"; do
            [[ "$result" == success ]] || { echo 'A required check failed, was cancelled or was skipped.'; exit 1; }
          done
