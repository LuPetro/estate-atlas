name: EstateAtlas checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_UNSTABLE_HEADLESS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=640
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all workspace types
        run: pnpm typecheck
      - name: Audit deployed dependencies
        run: pnpm security:check
      - name: Check proxy failure log privacy
        run: ./scripts/check-edge-privacy
      - name: Test business rules and real PostgreSQL API
        run: pnpm test
      - name: Build API and production web app
        run: pnpm build
      - name: Export native Android and iOS JavaScript
        run: pnpm mobile:export
      - name: Install Chromium with runner dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test desktop and mobile browser flows
        run: pnpm test:e2e
