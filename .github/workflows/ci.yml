name: EstateAtlas checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_UNSTABLE_HEADLESS: '1'
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=640
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check all workspace types
        run: pnpm typecheck
      - name: Audit deployed dependencies
        run: pnpm security:check
      - name: Test business rules and real PostgreSQL API
        run: pnpm test
      - name: Build API and production web app
        run: pnpm build
      - name: Export native Android and iOS JavaScript
        run: pnpm mobile:export
      - name: Install Chromium with runner dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Test desktop and mobile browser flows
        run: pnpm test:e2e
