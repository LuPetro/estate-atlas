name: EstateAtlas production deployment
on:
  workflow_dispatch:
    inputs:
      production_approval:
        description: Explicitly authorize deployment of the latest main commit
        required: true
        type: choice
        default: hold
        options:
          - hold
          - deploy
permissions:
  contents: read
concurrency:
  group: estateatlas-production-deploy
  cancel-in-progress: false
jobs:
  authorize:
    name: Verify latest CI before accessing production
    if: >-
      github.repository == 'LuPetro/estate-atlas' &&
      github.ref == 'refs/heads/main' &&
      inputs.production_approval == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      development_run_id: ${{ steps.development.outputs.run_id }}
      development_run_attempt: ${{ steps.development.outputs.run_attempt }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Require the latest successful CI attempt for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/assert-release-ci.mjs
      - name: Require this exact commit to have passed Dev deployment and HTTPS checks
        id: development
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/assert-development.mjs
  deploy-production:
    name: Deploy verified main commit
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over pinned SSH and verify HTTPS
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEVELOPMENT_RUN_ID: ${{ needs.authorize.outputs.development_run_id }}
          DEVELOPMENT_RUN_ATTEMPT: ${{ needs.authorize.outputs.development_run_attempt }}
          DEPLOY_ENVIRONMENT: production
          DEPLOY_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: ./scripts/deploy-ssh
