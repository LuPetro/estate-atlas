name: EstateAtlas production deployment
on:
  workflow_dispatch:
    inputs:
      production_approval:
        description: Explicitly authorize deployment of the latest main commit
        required: true
        type: choice
        default: hold
        options:
          - hold
          - deploy
permissions:
  actions: read
  contents: read
jobs:
  deploy-production:
    name: Deploy verified main commit
    if: >-
      github.repository == 'LuPetro/estate-atlas' &&
      github.ref == 'refs/heads/main' &&
      inputs.production_approval == 'deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
    concurrency:
      group: estateatlas-production-deploy
      cancel-in-progress: false
    env:
      RELEASE_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_SSH_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
    steps:
      - name: Require green CI for this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Release SHA is invalid.'; exit 1; }
          runs="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${RELEASE_SHA}&branch=main&status=success&per_page=100")"
          jq -e --arg sha "$RELEASE_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "push" and .conclusion == "success")] | length > 0' \
            <<<"$runs" >/dev/null || {
              echo 'No successful push CI run exists for this exact commit on main; deployment is blocked.'
              exit 1
            }
          echo "Verified green CI for ${RELEASE_SHA}."
      - name: Validate pinned SSH deployment settings
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo 'Set production variable DEPLOY_SSH_HOST.'; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z0-9._-]+$ ]] || { echo 'Set production variable DEPLOY_SSH_USER.'; exit 1; }
          [[ "$DEPLOY_PATH" == /* && "$DEPLOY_PATH" != *$'\n'* ]] || { echo 'Set production variable DEPLOY_PATH to an absolute path.'; exit 1; }
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo 'Set production variable DEPLOY_SSH_KNOWN_HOSTS to the pinned SSH host key.'; exit 1; }
          [[ -n "$DEPLOY_KEY" ]] || { echo 'Set production secret DEPLOY_SSH_PRIVATE_KEY.'; exit 1; }
      - name: Deploy over SSH and verify HTTPS
        run: |
          set -euo pipefail
          deploy_tmp="$(mktemp -d)"
          trap 'rm -rf "$deploy_tmp"' EXIT
          install -m 700 -d "$deploy_tmp/ssh"
          install -m 600 /dev/null "$deploy_tmp/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KEY" > "$deploy_tmp/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$deploy_tmp/ssh/known_hosts"
          ssh-keygen -y -f "$deploy_tmp/ssh/id_ed25519" >/dev/null
          port="${DEPLOY_PORT:-22}"
          [[ "$port" =~ ^[0-9]{1,5}$ ]] && (( port > 0 && port <= 65535 )) || { echo 'DEPLOY_SSH_PORT must be 1–65535.'; exit 1; }
          printf -v remote_command 'DEPLOY_PATH=%q RELEASE_SHA=%q bash -s' "$DEPLOY_PATH" "$RELEASE_SHA"
          ssh -i "$deploy_tmp/ssh/id_ed25519" \
            -p "$port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$deploy_tmp/ssh/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          : "${DEPLOY_PATH:?DEPLOY_PATH is required}"
          : "${RELEASE_SHA:?RELEASE_SHA is required}"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Release SHA is invalid.'; exit 1; }
          [[ -d "$DEPLOY_PATH/.git" ]] || { echo 'Deployment checkout is missing.'; exit 1; }
          cd "$DEPLOY_PATH"
          origin="$(git remote get-url origin)"
          [[ "$origin" == 'https://github.com/LuPetro/estate-atlas.git' || "$origin" == 'git@github.com:LuPetro/estate-atlas.git' ]] || { echo 'Unexpected Git origin; refusing deployment.'; exit 1; }
          [[ -z "$(git status --porcelain --untracked-files=no)" ]] || { echo 'Tracked server changes exist; refusing to overwrite them.'; exit 1; }
          git fetch --no-tags origin main
          [[ "$(git rev-parse FETCH_HEAD)" == "$RELEASE_SHA" ]] || { echo 'main moved after approval; rerun CI and approve its latest commit.'; exit 1; }
          git merge-base --is-ancestor HEAD "$RELEASE_SHA" || { echo 'Server checkout contains commits outside the approved release.'; exit 1; }
          git checkout main
          git reset --hard "$RELEASE_SHA"
          ./scripts/pnpm release:check
          ./scripts/docker --profile public up -d --build --wait
          ./scripts/pnpm release:check --live
          REMOTE
