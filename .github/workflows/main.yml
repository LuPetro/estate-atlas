name: EstateAtlas Main pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: estateatlas-main-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  authorize-production:
    needs: checks
    if: >-
      needs.checks.result == 'success' &&
      github.repository == 'LuPetro/estate-atlas' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      development_sha: ${{ steps.development.outputs.source_sha }}
      development_run_id: ${{ steps.development.outputs.run_id }}
      development_run_attempt: ${{ steps.development.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      # The checks dependency verifies this exact commit in the current run.
      # Requiring a completed push run here would block the run's own deployment.
      - name: Find and verify the identical source already tested on Dev
        id: development
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/assert-development.mjs
  deploy-production:
    needs: authorize-production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: production
      url: https://estateatlas.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Promote tested images and verify production HTTPS
        env:
          RELEASE_SHA: ${{ github.sha }}
          DEVELOPMENT_SHA: ${{ needs.authorize-production.outputs.development_sha }}
          DEVELOPMENT_RUN_ID: ${{ needs.authorize-production.outputs.development_run_id }}
          DEVELOPMENT_RUN_ATTEMPT: ${{ needs.authorize-production.outputs.development_run_attempt }}
          DEPLOY_ENVIRONMENT: production
          DEPLOY_HOST: ${{ vars.DEPLOY_SSH_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_SSH_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_SSH_KNOWN_HOSTS }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: ./scripts/deploy-ssh
