name: estate-atlas-gateway
services:
  gateway:
    image: caddy:2.11.2-alpine
    restart: unless-stopped
    environment:
      DEV_DOMAIN: ${DEV_DOMAIN:?}
      PROD_DOMAIN: ${PROD_DOMAIN:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      DEV_ACCESS_USER: ${DEV_ACCESS_USER:?}
      DEV_AUTH_HASH: ${DEV_AUTH_HASH:?}
    ports: ['80:80', '443:443']
    volumes:
      - ${EA_GATEWAY_DIR:?}/config:/etc/estateatlas:ro
      - data:/data
      - config:/config
    command: [caddy, run, --config, /etc/estateatlas/Caddyfile, --adapter, caddyfile]
    networks: [edge]
    mem_limit: 96m
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  data:
  config:
networks:
  edge:
    external: true
    name: estate-atlas-edge
