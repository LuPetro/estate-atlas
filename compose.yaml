name: estate-atlas
services:
  db:
    image: postgres:18.4-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: estateatlas
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    secrets:
      - postgres_admin_password
      - postgres_app_password
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker-init-db.sh:/docker-entrypoint-initdb.d/10-estate-atlas.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U postgres -d estateatlas']
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  api:
    image: estate-atlas-api:local
    build: { context: ., target: api }
    restart: unless-stopped
    init: true
    environment: &api_environment
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: estateatlas
      DATABASE_USER: estateatlas
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_app_password
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      ALLOW_LOCAL_HTTP: ${ALLOW_LOCAL_HTTP:-true}
      ACCOUNT_PUBLIC_URL: ${ACCOUNT_PUBLIC_URL:-http://localhost:3000}
      ACCOUNT_ENCRYPTION_KEY_FILE: /run/secrets/account_encryption_key
      ACCOUNT_REQUIRE_VERIFICATION: ${ACCOUNT_REQUIRE_VERIFICATION:-false}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_ALLOW_INSECURE: ${SMTP_ALLOW_INSECURE:-false}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      ANALYSIS_ENABLED: ${ANALYSIS_ENABLED:-false}
      ANALYSIS_MODELS: ${ANALYSIS_MODELS:-gpt-6-luna}
      # 0 disables a daily quota after owner approval; request bounds remain.
      ANALYSIS_USER_DAILY_LIMIT: ${ANALYSIS_USER_DAILY_LIMIT:-5}
      ANALYSIS_GLOBAL_DAILY_LIMIT: ${ANALYSIS_GLOBAL_DAILY_LIMIT:-20}
      GEOCODING_URL: ${GEOCODING_URL:-https://photon.komoot.io/api/}
    secrets: [postgres_app_password, openai_api_key, account_encryption_key, smtp_password]
    ports: ['127.0.0.1:${API_PORT:-4000}:4000']
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    logging: *logging

  worker:
    image: estate-atlas-api:local
    command: [node, dist/worker.mjs]
    environment: *api_environment
    secrets: [postgres_app_password, openai_api_key]
    restart: unless-stopped
    init: true
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "const f=require('fs');try{if(Date.now()-Number(f.readFileSync('/tmp/analysis-worker-health','utf8'))>20000)process.exit(1)}catch{process.exit(1)}",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    logging: *logging

  web:
    image: estate-atlas-web:local
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
        NEXT_PUBLIC_CARTO_MAPS_KEY: ${NEXT_PUBLIC_CARTO_MAPS_KEY:-}
    restart: unless-stopped
    init: true
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    logging: *logging

  mobile:
    profiles: [mobile]
    image: estate-atlas-mobile-preview:local
    build: { context: ., target: mobile-preview }
    init: true
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:4000}
      REACT_NATIVE_PACKAGER_HOSTNAME: localhost
      CI: '1'
    ports: ['127.0.0.1:8081:8081']
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:8081/status').then(async r=>{if(!r.ok||!((await r.text()).includes('packager-status:running')))process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    logging: *logging

  mail-preview:
    profiles: [mail-preview]
    image: axllent/mailpit:v1.29.3
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    logging: *logging

  backup:
    image: postgres:18.4-bookworm
    user: '${BACKUP_UID:-1000}:${BACKUP_GID:-1000}'
    restart: unless-stopped
    init: true
    environment:
      PGHOST: db
      PGUSER: estateatlas
      PGDATABASE: estateatlas
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    secrets: [postgres_app_password]
    entrypoint: [sh, /scripts/backup.sh]
    volumes:
      - ./scripts/backup.sh:/scripts/backup.sh:ro
      - ./.local/backups/automatic:/backups
    depends_on:
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    healthcheck:
      test:
        [
          CMD-SHELL,
          'test -f /tmp/backup-health && test $$(($$(date +%s)-$$(cat /tmp/backup-health))) -lt 120',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *logging

  restore-check:
    profiles: [restore-check]
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: estateatlas_restore
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      PGDATA: /var/lib/postgresql/18/docker
    secrets: [postgres_admin_password]
    volumes:
      - ./.local/backups/automatic:/backups:ro
    tmpfs: [/var/lib/postgresql, /tmp]
    mem_limit: 128m
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d estateatlas_restore']
      interval: 2s
      retries: 20
    logging: *logging

volumes:
  postgres_data:

secrets:
  account_encryption_key:
    file: ./.local/docker/account-encryption-key
  smtp_password:
    file: ./.local/docker/smtp-password
  postgres_admin_password:
    file: ./.local/docker/postgres-admin-password
  postgres_app_password:
    file: ./.local/docker/postgres-app-password
  openai_api_key:
    file: ./.local/docker/openai-api-key
